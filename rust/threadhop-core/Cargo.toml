[package]
name = "threadhop-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Task 1.13 (session_detect): async scan_active() uses tokio::process::Command.
# threadhop-tui enables this; the parsers stay available without it.
async = ["dep:tokio"]

[dependencies]
# Tasks 1.6–1.8 (db), 1.11 (fts), 1.12 (observations: conflict_reviews join).
# `bundled` ships sqlite with the crate; `serde_json` lets rusqlite store/read
# JSON values directly. FTS5 is enabled in the bundled build by default — no
# extra feature needed beyond these two.
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
# Tasks 1.3–1.4 (models), 1.10–1.15 (most modules).
serde.workspace = true
serde_json.workspace = true
# Task 1.5 (error).
thiserror.workspace = true
# Tasks 1.4 (parser warnings), 1.12 (observation parse warnings), 1.13.
tracing.workspace = true
# Reserved for timestamp parsing in upcoming tasks (already in workspace).
time.workspace = true
# Task 1.2 (paths::home).
dirs = "5"
# Task 1.9 (jsonl text cleaning regexes).
regex = "1"
# Task 1.9 (jsonl): once_cell::sync::Lazy for compiled regexes.
once_cell.workspace = true
# Task 1.13 (session_detect, optional under `async` feature).
tokio = { workspace = true, features = ["process", "macros", "rt"], optional = true }

[dev-dependencies]
# Tasks 1.6–1.8, 1.12, 1.15: tempdir-backed DB and config-file fixtures.
tempfile = "3"
# Tasks 1.10 (parse_byte_range golden) and future snapshot tests.
insta = { version = "1", features = ["json"] }
