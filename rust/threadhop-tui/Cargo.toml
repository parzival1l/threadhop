[package]
name = "threadhop-tui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
threadhop-core = { path = "../threadhop-core", features = ["async"] }
# Phase 3 — screens::search takes a `&rusqlite::Connection` so the App owns
# DB lifetime. Pinned to the same version threadhop-core uses to keep
# `Connection` a single type across the workspace.
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
# Phase 2 runtime: rt-multi-thread for tokio::main, sync for mpsc/watch,
# time for intervals, macros for select!, process for future worker tasks.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Sidebar truncation needs cell-width-aware string measurement so CJK + emoji
# session names don't overflow the 22-cell display column.
unicode-width = "0.1"
# Phase B — syntect for fenced-code syntax highlighting in the transcript.
# `default-fancy` is the pure-Rust feature combo (fancy-regex, no onig/C FFI).
# We bundle the default syntax + theme sets and pick `base16-ocean.dark` to
# pair with the OpenCode dark theme; only the fg color is propagated to spans
# (we keep the role-tinted row background — see widgets::transcript::md).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
