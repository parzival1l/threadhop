[workspace]
resolver = "2"
members = ["threadhop-core", "threadhop-tui"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
# Phase 1 — Task 1.9 (jsonl) uses once_cell::sync::Lazy for compiled regexes.
once_cell = "1"
# Phase 1 — Task 1.13 (session_detect, optional under `async` feature)
# and Phase 2 — threadhop-tui runtime. Shared so both crates pin the same major.
tokio = { version = "1", default-features = false }
