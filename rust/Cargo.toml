[workspace]
resolver = "2"
members = ["threadhop-core", "threadhop-tui"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
